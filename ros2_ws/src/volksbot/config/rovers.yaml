# This file is searched by volksbot program to find the connected rover configuration

#------------------------------------------------------------------------------
# CONFIG 
#------------------------------------------------------------------------------

# [int] count of tries of pings
ping_tries: 5

# [int] timeout between pings in milliseconds
ping_timeout_ms: 100

# [int] period in seconds of of rover search loop
publish_period_sec: 10

# [bool] if false will only publish active rover if the connected rover changed else always
always_publish: true

# [optional:] [bool] if true, will display the full rover table output of the main volksbot node; if false, will display a minimal info table output; default is false
use_full_rover_table_output: false


#------------------------------------------------------------------------------
# ROVERS
#------------------------------------------------------------------------------

# see reference declaration in volksface/volksbot.h 
# name                   # rover name (case insensitive)
# description            # [optional] unique rover description
# controller_color       # [optional] color of controller (for visual identification)
# wheel_diameter         # in cm
# wheel_base             # in cm - distance between wheel center points
                         # wheel_base := chassis_width + 2*wheel_width/2 == chassis_width + (full_width - chassis_width)/2 == (chassis_width + full_width)/2
# motor_controller       # id of motor controller
# motor_controller_port  # [optional] port to be passed to the specified motor controller, else automatic detection
# udev_symlink           # device port mapping (usually: /dev/xyz) as noted in 42-usb-serial-volksbot.rules
# ip_lms                 # static ip of laserscanner
# ip_livox               # [TODO] static ip of livox lidar
# wheel_mapping          # 2x2 matrix mapping wheels to motors [ m0_w0, m0_w1, 
#                                                                m1_w0, m1_w1 ]
# if wheel_mapping is missing will default to identity matrix 

---
name:                   VOX1
description:            lms no ip sticker
controller_color:       blue
wheel_diameter:         26.0
wheel_base:             40.5    # 32 + 2*8.5/2
motor_controller:       EPOS4
udev_symlink:           /dev/EPOS4
ip_lms:                 192.168.0.14
wheel_mapping:          [  0, -1, 
                           1,  0 ]

